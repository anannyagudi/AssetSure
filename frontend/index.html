<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- <link rel="icon" type="image/svg+xml" href="/favicon.svg" /> -->
  <!-- <link rel="icon" type="image/png" href="/AssetSure_logo.png" /> -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AssetSure</title>
  <!-- Theme flash prevention: apply saved theme class before first paint -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('assetsure-theme') || 'dark';
        document.documentElement.classList.add(t);
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
